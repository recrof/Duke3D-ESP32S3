; Duke Nukem 3D for ESP32-S3 boards (16 MB flash, 8 MB octal PSRAM).
; Engine and game sources are shared with the MG24 port (Engine/, Game/);
; main/ is the ESP32-S3 platform layer.
;   pio run -e tdeck -t upload      LilyGO T-Deck / T-Deck Plus
;   pio run -e wio_l2 -t upload     Seeed Studio Wio Tracker L2 / L2 Pro
[platformio]
default_envs = tdeck
src_dir = main

[env]
platform = espressif32@6.11.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

[env:tdeck]
board_build.cmake_extra_args = -DDUKE_BOARD=BOARD_TDECK

[env:wio_l2]
board_build.cmake_extra_args = -DDUKE_BOARD=BOARD_WIO_TRACKER_L2
